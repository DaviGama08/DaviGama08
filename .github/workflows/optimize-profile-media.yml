name: Optimize profile media

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-profile-media.yml'

permissions:
  contents: write

concurrency:
  group: profile-media-optimization
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Generate optimized versions and validate references
        run: python scripts/optimize_profile_media.py

      - name: Commit optimized media
        run: |
          if [[ -z "$(git status --porcelain README.md assets/optimized)" ]]; then
            echo "No smaller versions to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/optimized
          git commit -m "Optimize README media while preserving originals"
          git pull --rebase origin main
          git push origin HEAD:main
